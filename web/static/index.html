<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<title>大V动态监控</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="app-header">
  <div class="header-inner">
    <h1>大V动态监控</h1>
    <nav class="tabs">
      <button class="tab active" data-tab="feed">动态</button>
      <button class="tab" data-tab="manage">管理</button>
      <button class="tab" data-tab="settings">设置</button>
    </nav>
  </div>
</header>

<main class="container">
  <!-- 动态 -->
  <section id="view-feed" class="view active">
    <div class="toolbar">
      <div class="chips">
        <button class="chip active" data-platform="">全部</button>
        <button class="chip" data-platform="xueqiu">雪球</button>
        <button class="chip" data-platform="weibo">微博</button>
      </div>
      <div class="toolbar-row">
        <input id="search" type="search" placeholder="搜索作者或内容">
        <button id="btn-refresh" class="btn btn-primary">立即刷新</button>
      </div>
    </div>
    <div id="feed-list" class="feed"></div>
    <div id="feed-empty" class="empty hidden">暂无动态，点击「立即刷新」试试</div>
  </section>

  <!-- 管理 -->
  <section id="view-manage" class="view">
    <div class="toolbar">
      <button id="btn-add" class="btn btn-primary">＋ 添加大V</button>
      <span class="hint">增删大V后会自动同步到 GitHub</span>
    </div>
    <div id="inf-list" class="inf-list"></div>
  </section>

  <!-- 设置 -->
  <section id="view-settings" class="view">
    <div class="card">
      <h2>推送配置</h2>
      <div id="secrets-status" class="kv"></div>
      <div class="actions">
        <button id="btn-test-push" class="btn">发送测试消息</button>
      </div>
    </div>
    <div class="card">
      <h2>监控配置</h2>
      <div id="monitor-config" class="kv"></div>
    </div>
    <div class="card">
      <h2>网页访问</h2>
      <label class="switch-row">
        <span>允许局域网访问（手机可访问，需重启生效）</span>
        <input type="checkbox" id="allow-lan">
      </label>
      <label class="field">
        <span>访问口令（留空则不限制）</span>
        <input type="password" id="access-token" placeholder="可选">
      </label>
      <div class="actions">
        <button id="btn-save-settings" class="btn btn-primary">保存设置</button>
      </div>
    </div>
    <div class="card">
      <h2>最近运行</h2>
      <div id="last-run" class="kv"></div>
    </div>
    <div class="card">
      <h2>日志</h2>
      <pre id="logs" class="logs"></pre>
    </div>
  </section>
</main>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h2 id="modal-title">添加大V</h2>
    <label class="field">
      <span>平台</span>
      <select id="inf-platform">
        <option value="xueqiu">雪球</option>
        <option value="weibo">微博</option>
      </select>
    </label>
    <label class="field">
      <span>名称</span>
      <input id="inf-name" placeholder="如：养猫的叔">
    </label>
    <label class="field">
      <span>数字 ID 或主页链接</span>
      <input id="inf-user-id" placeholder="如 xueqiu.com/u/123456 或 weibo.com/u/1234567890">
    </label>
    <div class="actions">
      <button id="btn-modal-cancel" class="btn">取消</button>
      <button id="btn-modal-save" class="btn btn-primary">保存</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>
<script src="/static/app.js"></script>
</body>
</html>
